# Netlify deployment configuration for Veldic Wear
# Custom domain: https://veldicwear.com

[build]
  command = "npm run build"
  publish = ".next"

# Next.js plugin for Netlify (handles SSR, ISR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirects
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/__nextjs_original_path"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"